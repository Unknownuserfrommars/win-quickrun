[project]
name = "quickrun"
version = "0.6.0"
description = "Bind custom Win+R aliases to any Windows program"
requires-python = ">=3.9"

[project.scripts]
quickrun = "quickrun:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["quickrun"]
