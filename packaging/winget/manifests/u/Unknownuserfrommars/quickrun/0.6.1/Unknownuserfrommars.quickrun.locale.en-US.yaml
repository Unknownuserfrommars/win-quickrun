ShortDescription: Bind custom Win+R aliases to any Windows program.
Description: |-
  quickrun lets you launch any program from the Win+R Run dialog with a name you choose,
  e.g. "word" for Microsoft Word. It writes per-user App Paths registry entries, so it
  needs no admin rights and takes effect instantly. It can also auto-detect installed
  apps, search the PC for an exe, and create persistent PowerShell aliases.
